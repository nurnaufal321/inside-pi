name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/aveva-pi-archive-curriculum-8fx6sb]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: module-3-4-exception-compression/package-lock.json

      - name: Install dependencies
        working-directory: module-3-4-exception-compression
        run: npm ci

      - name: Build
        working-directory: module-3-4-exception-compression
        run: npx vite build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: module-3-4-exception-compression/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
